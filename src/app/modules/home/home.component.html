<!-- SECTION CAROUSEL -->
<section id="showcase">
  <div class="simple-carousel position-relative">
    @for (slide of slides; track slide.imageKey; let i = $index) {
      @if (i === activeSlideIndex) {
        <div class="carousel-item active">
          <img
            [src]="slide.imageKey | translate"
            [alt]="slide.altKey | translate"
            class="center"
          />
          <div class="carousel-caption d-md-block">
            <h1 class="display-4">{{ slide.labelKey | translate }}</h1>
            <p class="lead">{{ slide.infoKey | translate }}</p>
            <a [routerLink]="slide.linkKey | translate" [class]="slide.buttonClass">
              {{ slide.buttonKey | translate }}
            </a>
          </div>
        </div>
      }
    }

    <button type="button" class="carousel-control-prev" (click)="previousSlide()">
      <span aria-hidden="true">&lsaquo;</span>
    </button>
    <button type="button" class="carousel-control-next" (click)="nextSlide()">
      <span aria-hidden="true">&rsaquo;</span>
    </button>

  </div>
</section>
